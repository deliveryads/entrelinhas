<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120B07">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Entrelinhas">
<title>Entrelinhas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Instrument+Serif:ital@0;1&family=Italiana&display=swap">
<style>
:root{
  /* Identidade "Espresso e cobre" (Dark Autumn discreta, só escuro). Fundos quase pretos, textos claros de baixo brilho, botões tingidos.
     Camadas: --bar (barra de abas) < --bg (fundo) < --surface (painéis) < --card (cartões) < --raised (campos) */
  color-scheme:dark;
  --bar:#0E0805; --bg:#120B07; --surface:#160E09; --card:#1A110B; --raised:#22170F; --line:#2E1F14; --line2:#3B291B;
  --ink:#C9B99D; --text:#B3A389; --muted:#85776A;
  --accent:#A8653D; --accent-soft:#2B1A10; --accent-ink:#C08A63; --btn:#3A2415; --btn-ink:#C4906A; --on-accent:#120B07;
  --gold:#A78851; --gold-soft:#2A2015; --wine:#6F2924; --ok:#8FA07A; --warn:#C0904F;
  --serif:"Iowan Old Style","Palatino","Georgia",serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
body{padding-top:var(--safe-t)}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font:600 26px/1.15 var(--serif);margin:0;letter-spacing:-.01em}
.iconbtn{border:0;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;font-size:18px}
main{padding:4px 16px calc(96px + var(--safe-b));max-width:720px;margin:0 auto}
.banner{background:var(--gold-soft);color:var(--text);border-radius:12px;padding:10px 14px;font-size:14px;margin:6px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px}
.card h2{font:600 22px/1.3 var(--serif);margin:0 0 10px;color:var(--ink)}
.meta{color:var(--muted);font-size:13px}
.nota{font:18px/1.75 var(--serif);color:var(--text);letter-spacing:.005em}
.nota strong{font-weight:600;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:0;background:var(--accent-soft);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--accent-ink)}
.chip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip .x{margin-left:6px;opacity:.7}
.row{display:flex;gap:8px;align-items:center}
.row > *{flex:1}
.btn{border:0;border-radius:14px;padding:13px 16px;background:var(--btn);color:var(--btn-ink);font-weight:600;width:100%}
.btn.sec{background:var(--accent-soft);color:var(--accent-ink);border:0}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;width:auto}
.btn:disabled{opacity:.5}
.list .item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.item .t{font:600 16px/1.35 var(--serif);color:var(--ink)}
.item .s{color:var(--muted);font-size:13px;margin-top:2px}
.item.capa{display:flex;gap:12px;align-items:flex-start}
.thumb{width:40px;height:60px;border-radius:6px;flex:0 0 40px;background:var(--accent-soft) center/cover no-repeat;display:grid;place-items:center;font:600 16px var(--serif);color:var(--accent-ink)}
.capa-g{width:64px;height:96px;border-radius:6px;flex:0 0 64px;background:var(--accent-soft) center/cover no-repeat;border:0;padding:0}
.capas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.capa-op{aspect-ratio:2/3;border:1px solid var(--line);border-radius:8px;background:var(--raised) center/cover no-repeat;padding:0}
input[type=text],input[type=url],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:11px 12px;outline:none}
textarea{min-height:96px;resize:vertical}
label.l{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg .chip{white-space:nowrap;flex-shrink:0;padding:6px 12px}
.quote{font:italic 18px/1.6 var(--serif);color:var(--ink);border-left:2px solid var(--accent);padding-left:14px;margin:6px 0 10px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:2px 6px;background:var(--gold-soft);color:var(--warn)}
.badge.ok{background:transparent;color:var(--ok);border:1px solid currentColor}
.badge.warn{background:transparent;color:var(--warn);border:1px solid currentColor}
.bar{height:6px;border-radius:6px;background:var(--accent-soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 10px}
.mais{float:right;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bar);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-b))}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:5px 8px;min-width:58px;border-radius:18px}
nav.tabs button svg{width:23px;height:23px;fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
nav.tabs button.on svg{stroke:var(--accent-ink);opacity:1}
nav.tabs button.on{color:var(--accent-ink);background:var(--accent-soft);font-weight:600}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:36;background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;padding:10px 18px calc(24px + var(--safe-b));transform:translateY(100%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.sheet.open{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h3{font:600 22px/1.25 var(--serif);margin:0 0 4px;padding-right:46px}
.sheet .topo{position:sticky;top:0;height:0;z-index:2;display:flex;justify-content:flex-end}
.sheet .topo .iconbtn{width:36px;height:36px;font-size:15px;background:var(--raised);border-color:var(--line2)}
.toast{position:fixed;left:50%;bottom:calc(88px + var(--safe-b));transform:translateX(-50%);background:var(--raised);color:var(--ink);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:88vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.nota a,.meta a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.foto-prev{width:100%;border-radius:12px;border:1px solid var(--line);margin:8px 0}
.fab{position:fixed;right:18px;bottom:calc(82px + var(--safe-b));z-index:7;border:1px solid var(--line);border-radius:999px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:14px 18px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.sp{height:8px}
.crop{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.crop canvas{width:100%;display:block;border-radius:10px}
.crop .r{position:absolute;border:2px solid var(--accent);background:rgba(168,101,61,.15);pointer-events:none}
.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-t)}
.full .barra{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
.full .barra h3{font:600 20px var(--serif);margin:0}
.grafo{flex:1;position:relative;overflow:hidden;touch-action:none}
.grafo svg{width:100%;height:100%;display:block}
.grafo text{font-family:var(--sans);fill:var(--ink);pointer-events:none}
.grafo .lv circle{stroke:var(--bg);stroke-width:1.5;vector-effect:non-scaling-stroke}
.grafo line{stroke:var(--muted);stroke-opacity:.35;vector-effect:non-scaling-stroke}
.zoom{position:absolute;right:12px;bottom:calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:8px}
.navnota{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.navnota .meta{flex:1;text-align:center}
.seta{flex:0 0 34px;width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--accent-ink);border-radius:999px;display:grid;place-items:center;font-size:17px;line-height:1;padding:0}
.seta:disabled{opacity:.25}
details.refs{margin-top:12px}
details.refs summary{list-style:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--accent-ink);cursor:pointer}
details.refs summary::-webkit-details-marker{display:none}
details.refs summary::after{content:"▾";font-size:11px}
details.refs[open] summary::after{content:"▴"}
details.refs[open] summary{margin-bottom:8px}
.resp{display:flex;gap:8px;align-items:flex-end}
.resp textarea{flex:1}
.salvar{flex:0 0 46px;height:46px;border:0;border-radius:12px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;padding:0}
.salvar svg,.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.salvar:disabled{opacity:.5}
.nuvem{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px 8px;margin:2px 0 16px}
.nuvem .chip{line-height:1.25;padding:5px 11px}
.sec-tit{font:600 22px/1.3 var(--serif);margin:22px 2px 10px;color:var(--ink)}
.grafo text.oculto{display:none}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:20px;height:20px;margin-top:3px;flex:0 0 20px}
@media print{
  nav.tabs,header.top,.sheet,.sheet-bg,.fab,.toast,#app{display:none!important}
  #impressao{display:block!important;color:#000;font:12pt/1.5 Georgia,serif}
}
#impressao{display:none}
/* ===== Abertura (tags ao fundo + nome) ===== */
#abertura{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden;transition:opacity .4s ease}
#abertura.sai{opacity:0;pointer-events:none}
.ab-campo{position:absolute;left:22px;right:22px;top:calc(var(--safe-t) + 28px);bottom:calc(196px + var(--safe-b));display:flex;flex-wrap:wrap;justify-content:center;align-content:space-between;gap:10px 18px;overflow:hidden;font-family:"DM Mono",ui-monospace,Menlo,monospace;color:var(--ink)}
.ab-campo span{opacity:.075;line-height:1.15;white-space:nowrap}
.ab-campo span.on{opacity:.62;color:var(--accent-ink)}
.ab-fios{position:absolute;inset:0;pointer-events:none}
.ab-veu{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 62% 15% at 50% 44%,var(--bg) 45%,transparent 100%)}
.ab-nome{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);text-align:center;pointer-events:none}
.ab-nome .e{font:400 clamp(54px,15vw,72px)/1 "Italiana",var(--serif);letter-spacing:.05em;color:var(--ink)}
.ab-nome .l{font:italic 400 clamp(66px,19vw,92px)/1 "Instrument Serif",var(--serif);color:var(--accent-ink);margin-top:2px}
.ab-pe{position:absolute;left:26px;right:26px;bottom:calc(30px + var(--safe-b));text-align:center}
.ab-data{font:12px/1 "DM Mono",ui-monospace,Menlo,monospace;letter-spacing:.28em;color:var(--muted);margin-bottom:18px;text-transform:uppercase}
.ab-btn{width:100%;border:1px solid var(--line2);border-radius:999px;background:var(--btn);color:var(--btn-ink);font:400 22px/1 "Instrument Serif",var(--serif);padding:17px 16px}
.ab-sub{font:11px/1 "DM Mono",ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--muted);margin-top:16px}
.ab-ver{position:absolute;right:20px;bottom:calc(10px + var(--safe-b));font:10px/1 "DM Mono",ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--muted);opacity:.7;pointer-events:none}
@media (prefers-reduced-motion:reduce){#abertura{transition:none}}
</style>
</head>
<body>
<div id="abertura" role="dialog" aria-label="Abertura do Entrelinhas">
  <div class="ab-campo" id="abCampo" aria-hidden="true"></div>
  <svg class="ab-fios" id="abFios" aria-hidden="true"></svg>
  <div class="ab-veu"></div>
  <div class="ab-nome"><div class="e">Entre</div><div class="l">linhas</div></div>
  <div class="ab-pe"><div class="ab-data" id="abData"></div><button class="ab-btn" id="abBtn">Entrar</button><div class="ab-sub" id="abSub">&nbsp;</div></div>
  <div class="ab-ver" id="abVer"></div>
</div>
<header class="top"><h1 id="titulo">Hoje</h1><button class="iconbtn" data-a="recarregar" aria-label="Atualizar">↻</button></header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="hoje" aria-label="Hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>Hoje</button>
  <button data-tab="biblioteca" aria-label="Biblioteca"><svg viewBox="0 0 24 24"><path d="M4.5 4.5H8v15H4.5zM9.8 4.5h3.5v15H9.8zM15 5.6l3.3-.9 3.4 13.9-3.3.9z"/></svg>Biblioteca</button>
  <button data-tab="trechos" aria-label="Trechos"><svg viewBox="0 0 24 24"><path d="M3.5 5.6c3-1 6-1 8.5 1 2.5-2 5.5-2 8.5-1v13c-3-1-6-1-8.5 1-2.5-2-5.5-2-8.5-1z"/><path d="M12 6.6v13"/></svg>Trechos</button>
  <button data-tab="tags" aria-label="Tags"><svg viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.1 7.1a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.4"/></svg>Tags</button>
  <button data-tab="mais" aria-label="Mais"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18.5" cy="12" r="1.1"/></svg>Mais</button>
</nav>
<div class="sheet-bg" id="sheetbg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="topo"><button class="iconbtn" data-a="fechar" aria-label="Fechar">✕</button></div><div id="sheetc"></div></div>
<div id="tela"></div>
<div class="toast" id="toast"></div>
<div id="impressao"></div>
<input type="file" id="cam" accept="image/*" hidden>

<script>
/* ===== Configuração fixa (edite antes de publicar) ===== */
const CONFIG = {
  nomeApp: 'Entrelinhas',
  onesignalAppId: 'COLE_AQUI_O_APP_ID_DO_ONESIGNAL', // público, pode ficar no código
  externalId: 'fernando',                             // o mesmo usado no Apps Script (avisarNoApp)
  tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js' // leitura de texto no aparelho (gratuita)
};

function indiceTags() {

}
const temaDe = () => { const m = {}; TG().forEach(r => { if (r.tema) m[r.tag] = r.tema; }); return m; };
const vocabulario = () => Object.keys(indiceTags()).sort();

const pergunta = m => semFmt((String(m || '').split('\n').find(l => l.includes('🤔')) || '').replace('🤔', '')).trim();
/** separa o texto da nota: corpo (sem a pergunta 🤔 e sem a linha 🏷️) e o bloco 📚 Referências, que fica recolhido */
function partesNota(m) {
  const corpo = [], refs = []; let emRefs = false;
  String(m || '').split('\n').forEach(l => {
    if (/^\s*🏷️/.test(l) || l.includes('🤔')) { emRefs = false; return; }
    if (l.includes('📚')) { emRefs = true; return; }
    if (emRefs) { if (l.trim()) { refs.push(l); return; } emRefs = false; }
    corpo.push(l);
  });
  return { corpo: corpo.join('\n').replace(/\n{3,}/g, '\n\n').trim(), refs };
}
function notaHtml(m) {
  const { corpo, refs } = partesNota(m);
  return `<div class="nota">${fmt(corpo)}</div>` + (refs.length ? `<details class="refs"><summary>📚 Referências (${refs.filter(l => /^\s*[•\-–]/.test(l)).length || refs.length})</summary><div class="nota" style="font-size:16px">${fmt(refs.join('\n'))}</div></details>` : '');
}
const seqNotas = () => H().filter(r => /^(d|c)-/.test(String(r.id)));          // notas navegáveis: diárias e outras conexões
/** aprofundamentos (a) e conexões (c) de uma nota; aprofundamentos antigos, sem origem, contam pela data */
const derivadas = (nota, pref) => H().filter(r => String(r.id).startsWith(pref + '-') &&
  (String(r.origem || '') === String(nota.id) || (!r.origem && pref === 'a' && String(nota.id).startsWith('d-') && r.data === nota.data)));
const LIMITE_CONEXOES = 5;
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
function limpaTxt(s) { return sem(s).replace(/[^\p{L}\p{N}\s]/gu, ' ').split(/\s+/).filter(w => w.length > 2); }
function parecido(a, b) {
  const X = new Set(limpaTxt(a)), Y = new Set(limpaTxt(b)); if (!X.size || !Y.size) return false;
  let c = 0; X.forEach(w => { if (Y.has(w)) c++; });
  return c / Math.min(X.size, Y.size) >= 0.85 || c / new Set([...X, ...Y]).size >= 0.6;
}

/* ===== Capas (gratuito: link salvo no Acervo > Open Library > Google Books) ===== */
const filaCapas = []; let buscandoCapa = false;
const SEM_CAPA_DIAS = 7;   // livro sem capa encontrada: tenta de novo depois de 7 dias
const https = u => String(u || '').replace(/^http:\/\//, 'https://');
function capa(titulo) {
  const r = A().find(x => x.titulo === titulo);
  if (r && /^https?:\/\//.test(r.capa || '')) return https(r.capa);            // escolhida no app
  const u = S.capas[titulo];
  if (typeof u === 'string' && u.startsWith('http')) return u;
  const tentouHa = typeof u === 'string' && u.startsWith('!') ? (Date.now() - Number(u.slice(1))) / 864e5 : Infinity;
  if (tentouHa >= SEM_CAPA_DIAS && !filaCapas.includes(titulo)) { filaCapas.push(titulo); proximaCapa(); }
  return '';
}
const limpaTitulo = t => String(t || '').replace(/\(.*?\)/g, '').split(':')[0].trim();
const primeiroAutor = a => String(a || '').split(/ e |,|&/)[0].trim();
async function json(url) { const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
// candidatos de capa, do mais provável para o menos
async function candidatosCapa(titulo, autor, max = 1) {
  const t = limpaTitulo(titulo), a = primeiroAutor(autor), out = [];
  const add = u => { if (u && !out.includes(u)) out.push(u); };
  const ol = async q => { const j = await json('https://openlibrary.org/search.json?' + new URLSearchParams({ ...q, limit: String(Math.max(3, max)), fields: 'cover_i' }));
    (j.docs || []).forEach(d => d.cover_i && add(`https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`)); };
  const gb = async q => { const j = await json('https://www.googleapis.com/books/v1/volumes?' + new URLSearchParams({ q, maxResults: String(Math.max(3, max)), printType: 'books', fields: 'items(volumeInfo/imageLinks)' }));
    (j.items || []).forEach(it => { const l = it.volumeInfo?.imageLinks; if (l) add(https(l.thumbnail || l.smallThumbnail).replace('&edge=curl', '')); }); };
  const passos = [() => ol({ title: t, author: a }), () => gb(`intitle:${t}` + (a ? ` inauthor:${a}` : '')), () => ol({ title: t }), () => gb(`${t} ${a}`)];
  let erros = 0;
  for (const p of passos) { if (out.length >= max) break; try { await p(); } catch (e) { erros++; } }
  if (!out.length && erros === passos.length) throw new Error('sem conexão');   // não grava "sem capa" quando foi falha de rede
  return out.slice(0, max);
}
async function proximaCapa() {
  if (buscandoCapa || !filaCapas.length || !navigator.onLine) return;
  buscandoCapa = true;
  const titulo = filaCapas.shift(), r = A().find(x => x.titulo === titulo);
  try {
    const [u] = await candidatosCapa(titulo, r?.autor, 1);
    S.capas[titulo] = u || '!' + Date.now();
    store.set('capas', S.capas);
    if (u) document.querySelectorAll(`[data-capa="${CSS.escape(titulo)}"]`).forEach(el => { el.style.backgroundImage = `url("${u}")`; el.textContent = ''; });
  } catch (e) { /* falha de rede: tenta de novo na próxima abertura */ }
  buscandoCapa = false; setTimeout(proximaCapa, 350);
}

function paraJpeg(src, sx, sy, sw, sh, max = 1600, q = 0.85) {
  const k = Math.min(1, max / Math.max(sw, sh));
  const c = document.createElement('canvas'); c.width = Math.round(sw * k); c.height = Math.round(sh * k);
  c.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const url = c.toDataURL('image/jpeg', q);
  return { url, b64: url.split(',')[1], mime: 'image/jpeg', canvas: c };
}

/* ===== Mapa de conexões entre livros (por tags em comum) ===== */
const tagsDo = r => [...new Set(T(r.tags))];
function vizinhos(titulo) {
  const r = A().find(x => x.titulo === titulo); if (!r) return [];
  const minhas = new Set(tagsDo(r));

    .map(x => ({ livro: x, comuns: tagsDo(x).filter(t => minhas.has(t)) }))

}
const COR_CAT = { 'Ficção e clássicos': 'var(--accent)', 'Filosofia e ciências humanas': 'var(--gold)' };
function abrirMapa(filtroTema) {
  const tm = temaDe(), temas = [...new Set(Object.values(tm))].sort();
  const noTema = t => !filtroTema || tm[t] === filtroTema;
  const minimo = filtroTema ? 1 : 2;                       // em "Tudo", só liga livros com 2+ tags em comum

  const arestas = [], grau = {};
  for (let i = 0; i < livros.length; i++) {
    const a = new Set(tagsDo(livros[i]).filter(noTema));
    for (let j = i + 1; j < livros.length; j++) {
      const n = tagsDo(livros[j]).filter(t => a.has(t)).length;
      if (n >= minimo) { arestas.push([livros[i].titulo, livros[j].titulo, n]); [livros[i].titulo, livros[j].titulo].forEach(t => { grau[t] = (grau[t] || 0) + 1; }); }
    }
  }
  const nos = livros.filter(r => grau[r.titulo]).map(r => ({ id: r.titulo, cat: r.categoria })), soltos = livros.length - nos.length;
  const pos = {};

/** nomes do mapa sem sobreposição: o tamanho da letra acompanha o zoom e, quando dois nomes se cruzam, fica o do livro mais ligado */
function rotular() {

  const k = S.vb[2] / (g.clientWidth || 390), fs = 12 * k, caixas = [];
  const nos = [...svg.querySelectorAll('g.lv')].map(el => { const [x, y] = el.dataset.xy.split(',').map(Number), c = el.querySelector('circle'), rr = Number(c.getAttribute('r'));
    caixas.push([x - rr, y - rr, x + rr, y + rr]); return { el, x, y, rr, grau: Number(el.dataset.grau) }; });
  nos.sort((a, b) => b.grau - a.grau).forEach(n => {
    const tx = n.el.querySelector('text');
    tx.classList.remove('oculto'); tx.setAttribute('x', (n.rr + 4 * k).toFixed(1)); tx.setAttribute('y', (4 * k).toFixed(1)); tx.style.fontSize = fs.toFixed(1) + 'px';
    const w = (tx.getComputedTextLength ? tx.getComputedTextLength() : 0) || tx.textContent.length * fs * .56;
    const b = [n.x + n.rr + 3 * k, n.y - fs * .75, n.x + n.rr + 4 * k + w, n.y + fs * .45];
    const bate = caixas.some(c => b[0] < c[2] && b[2] > c[0] && b[1] < c[3] && b[3] > c[1]);
    if (bate) tx.classList.add('oculto'); else caixas.push(b);

}

/* ===== Cartão-imagem para compartilhar ===== */
function quebrar(ctx, texto, larg) {
  const linhas = []; String(texto).split('\n').forEach(par => { let l = '';
    par.split(/\s+/).forEach(p => { const t = l ? l + ' ' + p : p; if (ctx.measureText(t).width > larg && l) { linhas.push(l); l = p; } else l = t; });
    linhas.push(l); });
  return linhas;
}
async function cartaoImagem({ citacao, titulo, linha2, rodape }) {
  const W = 1080, Hh = 1350, c = document.createElement('canvas'); c.width = W; c.height = Hh; const x = c.getContext('2d');
  x.fillStyle = '#120B07'; x.fillRect(0, 0, W, Hh); x.fillStyle = '#A8653D'; x.fillRect(90, 150, 10, 180);
  let tam = 58, linhas;
  do { x.font = `italic ${tam}px Georgia, serif`; linhas = quebrar(x, citacao, W - 230); tam -= 4; } while (linhas.length * tam * 1.45 > 800 && tam > 30);
  x.fillStyle = '#C9B99D'; x.textBaseline = 'top'; let y = 150;
  linhas.forEach(l => { x.fillText(l, 130, y); y += (tam + 4) * 1.45; });
  y += 50; x.font = '600 40px Georgia, serif'; x.fillStyle = '#C08A63'; quebrar(x, titulo, W - 230).forEach(l => { x.fillText(l, 130, y); y += 52; });
  if (linha2) { x.font = '34px -apple-system, sans-serif'; x.fillStyle = '#85776A'; x.fillText(linha2, 130, y + 6); }
  x.font = 'italic 600 34px Georgia, serif'; x.fillStyle = '#A8653D'; x.fillText(rodape || CONFIG.nomeApp, 90, Hh - 110);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
  const file = new File([blob], 'trecho.png', { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  abrir(`<h3>Imagem pronta</h3><img class="foto-prev" src="${c.toDataURL('image/png')}" alt="Cartão"><div class="meta">Toque e segure a imagem para salvar ou compartilhar.</div>`);
}

  if (e.key === 'Enter' && e.target.id?.endsWith('_in')) { e.preventDefault(); AC.porTag(e.target.id.slice(0, -3)); } });
document.addEventListener('input', e => {
  const k = e.target.dataset.in; if (!k) return;
  S[k] = e.target.value; clearTimeout(S._deb);
  S._deb = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = document.querySelector(`[data-in="${k}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (x) {} } }, 200);
});
$('#sheetbg').addEventListener('click', fechar);
/* deslizar o painel para baixo fecha (quando ele está no topo; não vale em campos de texto nem no recorte da foto) */
(() => { const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if (sh.scrollTop > 0 || e.target.closest('textarea,input,select,.crop')) { y0 = null; return; } y0 = e.touches[0].clientY; dy = 0; }, { passive: true });
  sh.addEventListener('touchmove', e => { if (y0 === null) return; dy = e.touches[0].clientY - y0;
    if (dy > 0) { sh.style.transition = 'none'; sh.style.transform = `translateY(${dy}px)`; } }, { passive: true });
  sh.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sh.style.transition = ''; sh.style.transform = ''; if (dy > 90) fechar(); dy = 0; });
})();
$('#cam').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const { img, url } = await carregarImagem(f);
    if (S.modoFoto === 'local') { S.foto = { img, url }; painelRecorte(); return; }
    const j = paraJpeg(img, 0, 0, img.width, img.height);
    if (S.modoFoto === 'capa') { await lerCapa(j); return; }
    if (S.modoFoto === 'estante') {
      abrir('<h3>Lendo a estante…</h3><div class="empty"><span class="spin"></span></div>');
      try { const r = await acao({ acao: 'estante', imagem_b64: j.b64, mime: j.mime }); if (!r) return fechar();
        if (!r.livros || !r.livros.length) return painelResultado('Estante', r.texto || 'Nenhum livro identificado.');
        painelEstante(r.livros); } catch (x) { fechar(); toast('Erro: ' + x.message, 4000); }
      return;
    }
  } catch (x) { toast(x.message); }
});
window.addEventListener('hashchange', () => { let a = location.hash.slice(1); if (a === 'historico') a = 'trechos'; if (ABAS[a] && a !== S.aba) { S.aba = a; render(); } });
/** Adicionar livro: a IA lê a capa e preenche título e autor (gasta tokens); categoria e tags ficam guardadas para gravar direto */
async function lerCapa(j) {
  const info = $('#nlInfo'); if (!info) return;
  info.innerHTML = '<span class="spin"></span> Lendo a capa…';
  try {
    const r = await acao({ acao: 'estante', modo: 'capa', imagem_b64: j.b64, mime: j.mime });
    if (!r) { info.textContent = ''; return; }
    const l = (r.livros || [])[0];
    if (!l) { info.textContent = r.texto || 'Não consegui identificar o livro.'; return; }
    $('#nlT').value = l.titulo || ''; if (l.autor) $('#nlA').value = l.autor;
    S.capaInfo = { titulo: l.titulo, autor: l.autor || '', categoria: l.categoria || '', tags: T(l.tags) };
    const ja = l.ja_no_acervo || A().some(x => sem(x.titulo) === sem(l.titulo));
    info.innerHTML = ja ? '⚠️ Este livro já está no acervo.' : `${esc(l.categoria || '')}${S.capaInfo.tags.length ? ' · ' + S.capaInfo.tags.map(t => '#' + esc(t)).join(' ') : ''}`;
  } catch (x) { info.textContent = 'Erro: ' + x.message; }
}

/* ===== Render ===== */
function render() {
  const aba = S.aba;
  $('#titulo').textContent = aba === 'hoje' ? CONFIG.nomeApp : ABAS[aba];
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === aba));
  if (!S.dados) { $('#app').innerHTML = '<div class="empty"><span class="spin"></span></div>'; return; }
  const banner = S.demo ? '<div class="banner">Modo demonstração com dados de exemplo. Configure a conexão em <b>Mais</b>.</div>' : '';
  const telas = { hoje: telaHoje, biblioteca: telaBiblioteca, trechos: telaTrechos, tags: telaTags, mais: telaMais };
  $('#app').innerHTML = banner + telas[aba]();
  if (!S._abMontada && $('#abertura')) { S._abMontada = true; montarAbertura(); }
}

/* ===== Abertura: campo de tags do acervo; as tags da nota do dia acendem e se ligam ===== */
function semente(txt) { let h = 2166136261; for (const c of txt) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; }
function notaDoDia() { const l = H().filter(n => String(n.id || '').startsWith('d-')); const h = l.find(n => n.data === hoje()); return { nota: h || l[l.length - 1] || null, eHoje: !!h, total: l.length }; }
function montarAbertura() {
  const ab = $('#abertura'); if (!ab || ab.classList.contains('sai') || !S.dados) return;
  const { nota, eHoje, total } = notaDoDia(), rnd = semente(hoje());
  const dt = new Date(hoje() + 'T12:00:00');
  $('#abData').textContent = dt.toLocaleDateString('pt-BR', { weekday: 'long', timeZone: 'America/Sao_Paulo' }).replace('-feira', '') + ' · ' + dt.getDate() + ' · ' + dt.toLocaleDateString('pt-BR', { month: 'long' });
  $('#abBtn').textContent = eHoje ? 'Ler a nota de hoje' : nota ? 'Ler a última nota' : 'Entrar';
  const nLivros = nota ? String(nota.livros || '').split(';').filter(x => x.trim()).length : 0, nArt = nota ? String(nota.artigos || '').split(' ;; ').filter(x => x.trim()).length : 0;
  $('#abSub').textContent = nota ? `nota nº ${total} · ${nLivros} livro${nLivros === 1 ? '' : 's'}${nArt ? ` · ${nArt} artigo${nArt === 1 ? '' : 's'}` : ''}` : 'a primeira nota chega às 7h';
  const vocab = Object.entries(indiceTags()).sort((a, b) => b[1].livros.size - a[1].livros.size).map(([t]) => t);
  if (!vocab.length) { if (S.viaPush) entrarSozinho(0); return; }
  const acesas = [...new Set(T(nota?.tags))].filter(t => vocab.includes(t)).slice(0, 5);
  const lista = []; while (lista.length < 140) lista.push(...vocab.slice().sort(() => rnd() - .5));
  const corpo = lista.slice(0, 140).filter(t => !acesas.includes(t));
  acesas.forEach((t, i) => corpo.splice(Math.round((i + .5) / acesas.length * 70) + 4, 0, '§' + t));   // espalhadas pela parte visível
  const tam = [11, 12, 13, 15, 18, 22];
  $('#abCampo').innerHTML = corpo.map(t => { const on = t.startsWith('§'), n = on ? t.slice(1) : t;
    return `<span class="${on ? 'on' : ''}" style="font-size:${on ? 15 + Math.round(rnd() * 5) : tam[Math.floor(rnd() * tam.length)]}px">#${esc(n)}</span>`; }).join('');
  requestAnimationFrame(() => {
    const campo = $('#abCampo'), rc = campo.getBoundingClientRect();
    [...campo.children].forEach(e => { if (e.getBoundingClientRect().bottom > rc.bottom - 2 && !e.classList.contains('on')) e.remove(); });   // nada cortado no rodapé
    [...campo.children].forEach(e => { if (e.getBoundingClientRect().bottom > rc.bottom - 2) e.remove(); });
    // as tags da nota ocupam lugares fixos acima e abaixo do nome, em linhas diferentes, para o fio cruzar a tela por trás do nome
    const r0top = ab.getBoundingClientRect().top, r0h = ab.getBoundingClientRect().height;
    const pos = e => { const r = e.getBoundingClientRect(); return (r.top + r.bottom) / 2 - r0top; };
    const todos = [...campo.children], comuns = vocab.filter(t => !acesas.includes(t));
    todos.forEach((e, k) => { if (e.classList.contains('on')) { e.classList.remove('on'); e.textContent = '#' + comuns[k % comuns.length]; } });
    const linhasDe = filtro => { const m = new Map(); todos.forEach(e => { const y = Math.round(pos(e)); if (filtro(y / r0h) && parseInt(e.style.fontSize) >= 15) { const k = [...m.keys()].find(v => Math.abs(v - y) < 6) ?? y; (m.get(k) || m.set(k, []).get(k)).push(e); } }); return [...m.values()]; };
    const cima = linhasDe(t => t < .30), baixo = linhasDe(t => t > .58);
    const alvos = acesas.map((t, i) => { const z = i % 2 ? baixo : cima, n = Math.ceil(acesas.length / 2), j = Math.floor(i / 2);
      const linha = z[Math.min(z.length - 1, Math.floor((j + .5) * z.length / n))] || []; return linha[Math.floor(linha.length * ((i * .61 + .2) % 1))]; });
    alvos.forEach((e, i) => { if (!e) return; e.textContent = '#' + acesas[i]; e.classList.add('on'); });
    [...campo.children].forEach(e => { if (e.getBoundingClientRect().bottom > rc.bottom - 2 && !e.classList.contains('on')) e.remove(); });
    const svg = $('#abFios'), r0 = ab.getBoundingClientRect();
    const pts = alvos.filter(Boolean).map(e => { const r = e.getBoundingClientRect(); return [r.left - r0.left + r.width / 2, r.top - r0.top + r.height / 2]; }).filter(p => p[1] > 0);
    svg.setAttribute('viewBox', `0 0 ${r0.width} ${r0.height}`);
    const anim = !matchMedia('(prefers-reduced-motion: reduce)').matches, dur = 1500, passo = pts.length > 1 ? dur / (pts.length - 1) : 0;
    svg.innerHTML = (pts.length > 1 ? `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-opacity=".38" stroke-width="1"/>` : '') +
      pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1] + 13}" r="2.5" fill="var(--accent)" fill-opacity=".7" style="${anim ? `opacity:0;transition:opacity .35s ease ${Math.round(i * passo)}ms` : ''}"/>`).join('');
    // o fio se desenha de tag em tag; os pontos acendem quando o fio chega
    const pl = svg.querySelector('polyline');
    if (anim && pl && pl.getTotalLength) {
      const L = pl.getTotalLength(); pl.style.strokeDasharray = L; pl.style.strokeDashoffset = L; pl.getBoundingClientRect();
      pl.style.transition = `stroke-dashoffset ${dur}ms ease-in-out`; pl.style.strokeDashoffset = 0;
    }
    if (anim) requestAnimationFrame(() => svg.querySelectorAll('circle').forEach(c => { c.style.opacity = 1; }));
    S.abAnimada = true;
    if (S.viaPush) entrarSozinho(anim ? dur + 700 : 400);
  });
}
/** aberto pelo aviso de nota nova: a abertura aparece, o fio termina e o app entra sozinho na nota */
function entrarSozinho(ms) { if (S._auto) return; S._auto = setTimeout(() => { S.notaId = null; fecharAbertura(); }, ms); }
function fecharAbertura() {
  const ab = $('#abertura'); if (!ab) return;
  ab.classList.add('sai'); try { sessionStorage.setItem('ab_vista', '1'); } catch (e) {}
  S.aba = 'hoje'; location.hash = 'hoje'; render(); setTimeout(() => ab.remove(), 450);
}
$('#abBtn').addEventListener('click', fecharAbertura);
$('#abVer').textContent = 'v' + VERSAO;
let abVista = false; try { abVista = sessionStorage.getItem('ab_vista') === '1'; } catch (e) {}
if (abVista) $('#abertura').remove();
window.addEventListener('resize', () => montarAbertura());

/* ===== Início ===== */
render();
carregar(true);
window.OneSignalDeferred = window.OneSignalDeferred || [];
if (CONFIG.onesignalAppId && !CONFIG.onesignalAppId.startsWith('COLE') && location.protocol === 'https:') {
  const base = location.pathname.replace(/[^/]*$/, '');
  OneSignalDeferred.push(async OS => {
    try {
      await OS.init({ appId: CONFIG.onesignalAppId, serviceWorkerPath: base.slice(1) + 'sw.js', serviceWorkerParam: { scope: base } });
      await OS.login(CONFIG.externalId);
      OS.Notifications.addEventListener('click', () => {           // toque no aviso com o app já aberto em segundo plano
        S.viaPush = true;
        if ($('#abertura') && !$('#abertura').classList.contains('sai')) { if (S.abAnimada) entrarSozinho(1800); }
        else AC.ir('hoje');
      });
      if (S.aba === 'mais') render();
    } catch (e) { console.log('OneSignal', e); }
  });
} else if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
